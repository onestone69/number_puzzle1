name: number_puzzle1
description: "Sliding Number Puzzle"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  easy_localization: ^3.0.7+1
  shared_preferences: ^2.2.3
  google_mobile_ads: ^9.2.0
  material_ui: ^1.11.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  # 앱의 입체 보드 위젯으로 렌더링한 아이콘 (tool/render_app_icon_test.dart로 다시 생성 가능)
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # 앞면 이미지에 이미 안전 여백이 있으므로 추가 여백 없음
  adaptive_icon_foreground_inset: 0

flutter:

  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/sounds/
  
  fonts:
    - family: HiMelody
      fonts:
        - asset: assets/fonts/HiMelody-Regular.ttf
